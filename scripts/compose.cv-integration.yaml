# Isolated Week 3 integration stack. Never reuse the team's main containers or volumes.
name: matchajob-cv-week3-test
services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matchajob_db
      POSTGRES_USER: matchajob_user
      POSTGRES_PASSWORD: matchajob_password
    ports: ['15434:5432']
    volumes:
      - cv_integration_db:/var/lib/postgresql/data
      - ../docker/postgres/01-init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matchajob_user -d matchajob_db']
      interval: 5s
      timeout: 5s
      retries: 12
  ai-worker:
    build:
      context: ../ai-worker
    environment:
      APP_ENV: test
      AI_PROVIDER: deterministic
      AI_API_KEY: ''
    ports: ['18002:8000']
  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/matchajob_db
      SPRING_DATASOURCE_USERNAME: matchajob_user
      SPRING_DATASOURCE_PASSWORD: matchajob_password
      MATCHAJOB_UPLOAD_DIR: /data/cv
      AI_WORKER_BASE_URL: http://ai-worker:8000
      REQUIRE_EMAIL_VERIFICATION: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:15173
    ports: ['18082:8080']
    volumes: ['cv_integration_storage:/data/cv']
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_DATA_SOURCE: api
      VITE_API_BASE_URL: http://localhost:18082/api
    ports: ['15173:5173']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  cv_integration_db:
  cv_integration_storage:
