<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Khôi phục mật khẩu MatchaJob"><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"><title>Khôi phục mật khẩu - MatchaJob</title></head>
<body>
<main class="auth-split">
  <section class="auth-story">
    <div class="auth-bg-layer" aria-hidden="true">
      <div class="auth-bg-slide active" data-bg-role="candidate" style="background-image: url('assets/auth-candidate.jpg');"></div>
      <div class="auth-bg-overlay"></div>
    </div>
    <a class="brand light-brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt=""><span>MatchaJob</span></a>
    <div class="auth-story-body">
      <span class="eyebrow">Bảo mật tài khoản</span>
      <h1>Lấy lại quyền truy cập trong vài phút.</h1>
      <p>Chúng tôi sẽ gửi mã xác thực đến email đã đăng ký. Không chia sẻ mã này với bất kỳ ai.</p>
    </div>
    <small>© 2026 MatchaJob · Match a Job</small>
  </section>
  <section class="auth-form-side"><div class="auth-top-actions"><a href="login.html">← Quay lại đăng nhập</a><button class="icon-btn" data-theme-toggle aria-label="Đổi giao diện">☾</button></div><div class="auth-card auth-card-clean"><span class="auth-step">BƯỚC 1 / 3</span><h1>Quên mật khẩu?</h1><p>Nhập email để nhận mã xác thực.</p><form id="forgot-form"><div class="form-group"><label>Email</label><input id="forgot-email" class="form-control" type="email" placeholder="name@example.com"></div><button class="btn btn-primary full-width">Gửi mã xác thực</button></form><div class="auth-footer">Đã nhớ mật khẩu? <a href="login.html">Đăng nhập</a></div></div></section>
</main>
<script src="js/app.js"></script><script src="js/forms.js"></script>
</body></html>
