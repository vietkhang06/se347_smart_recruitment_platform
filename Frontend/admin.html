<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MatchaJob - trung tâm quản trị nền tảng">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
<title>Trung tâm quản trị - MatchaJob</title>
</head>
<body data-portal="admin">
<header class="portal-header admin-header">
  <div class="portal-header-main">
    <a class="brand" href="admin.html#overview"><img class="brand-logo" src="assets/logo.svg" alt=""><span class="brand__name">MatchaJob</span></a>
    <nav class="portal-nav" aria-label="Điều hướng quản trị">
      <a href="#overview" data-view="overview"><span>⌂</span>Tổng quan</a>
      <a href="#users" data-view="users"><span>◎</span>Người dùng</a>
      <a href="#moderation" data-view="moderation"><span>✓</span>Kiểm duyệt</a>
      <a href="#reports" data-view="reports"><span>!</span>Báo cáo</a>
      <a href="#categories" data-view="categories"><span>▦</span>Danh mục</a>
      <a href="#system" data-view="system"><span>⚙</span>Hệ thống</a>
      <a href="#logs" data-view="logs"><span>≡</span>Nhật ký</a>
    </nav>
    <div class="portal-header-actions">
      <label class="portal-search">⌕ <input placeholder="Tìm kiếm"></label>
      <button class="icon-btn" data-theme-toggle aria-label="Đổi giao diện">☾</button>
      <button class="icon-btn notification-button" data-view="notifications" aria-label="Thông báo">○<i></i></button>
      <div class="user-dropdown">
        <button class="user-chip" data-user-menu-trigger aria-expanded="false" aria-label="Menu tài khoản"><span class="avatar tiny-avatar admin-avatar">AD</span><span>Admin</span><b>⌄</b></button>
        <div class="user-dropdown-menu" data-user-menu>
          <div class="user-dropdown-header">
            <strong>Hà Minh Đức</strong>
            <small>Quản trị viên nền tảng</small>
          </div>
          <a class="user-dropdown-item" href="#profile" data-view="profile"><span>⚙</span> Hồ sơ quản trị</a>
          <a class="user-dropdown-item" href="#system" data-view="system"><span>⚙</span> Cấu hình hệ thống</a>
          <a class="user-dropdown-item" href="#logs" data-view="logs"><span>≡</span> Nhật ký vận hành</a>
          <div class="user-dropdown-divider"></div>
          <button class="user-dropdown-item text-danger" data-logout><span>⇥</span> Đăng xuất</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="portal-shell" data-portal="admin">
  <section class="portal-page-head">
    <div><h1 data-portal-title></h1><p data-portal-subtitle></p></div>
    <div class="portal-page-actions" data-page-actions></div>
  </section>
  <section id="portal-content" aria-live="polite"></section>
</main>

<div class="modal-backdrop" id="portal-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><h3 data-modal-title>Xác nhận</h3><button class="icon-btn modal-close" data-modal-close aria-label="Đóng">×</button></div>
    <div data-modal-body></div>
    <div class="modal-actions"><button class="btn btn-outline" data-modal-close>Hủy</button><button class="btn btn-primary" data-modal-confirm>Xác nhận</button></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
