server:
  port: 0
  servlet:
    context-path: /api

spring:
  application:
    name: matchajob-backend-test
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_TEST_DB:matchajob_test}}
    username: ${SPRING_TEST_DATASOURCE_USERNAME:matchajob_user}
    password: ${SPRING_TEST_DATASOURCE_PASSWORD:matchajob_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MatchaJobTestHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

ai-worker:
  base-url: ${AI_WORKER_BASE_URL:http://localhost:8001}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

management:
  endpoint:
    health:
      show-details: always
