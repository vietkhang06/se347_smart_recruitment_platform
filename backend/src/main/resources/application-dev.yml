spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/matchajob_db}
    username: ${SPRING_DATASOURCE_USERNAME:matchajob_user}
    password: ${SPRING_DATASOURCE_PASSWORD:matchajob_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MatchaJobHikariPool
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

ai-worker:
  base-url: ${AI_WORKER_BASE_URL:http://localhost:8001}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

app:
  auth:
    require-email-verification: false

security:
  jwt:
    secret: ${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9tYXRjaGFqb2JfZGV2XzIwMjY=}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
