# Production Profile Configuration for MatchaJob Backend
server:
  port: ${BACKEND_CONTAINER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: matchajob-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MatchaJobProdHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

ai-worker:
  base-url: ${AI_WORKER_BASE_URL:http://ai-worker:8000}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  processing-timeout-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}

app:
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

