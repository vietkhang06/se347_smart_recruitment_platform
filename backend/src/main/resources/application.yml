server:
  port: ${BACKEND_CONTAINER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always

spring:
  application:
    name: matchajob-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MATCHAJOB_CV_MAX_FILE_SIZE:10MB}
      max-request-size: ${MATCHAJOB_CV_MAX_REQUEST_SIZE:11MB}

matchajob:
  upload-dir: ${MATCHAJOB_UPLOAD_DIR:target/uploads/cv}
  cv:
    max-file-size: ${MATCHAJOB_CV_MAX_FILE_SIZE:10MB}
    processing:
      enabled: ${MATCHAJOB_CV_PROCESSING_ENABLED:true}
      poll-delay-ms: ${MATCHAJOB_CV_PROCESSING_POLL_DELAY_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,pgVector

security:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  auth:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
