services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchajob_db}
      POSTGRES_USER: ${POSTGRES_USER:-matchajob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchajob_user} -d ${POSTGRES_DB:-matchajob_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - matchajob_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    environment:
      - VITE_DATA_SOURCE=${VITE_DATA_SOURCE:-api}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8081/api}
      - PORT=${FRONTEND_CONTAINER_PORT:-5173}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - matchajob_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8081}:${BACKEND_CONTAINER_PORT:-8080}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - BACKEND_CONTAINER_PORT=${BACKEND_CONTAINER_PORT:-8080}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-matchajob_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-matchajob_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - AI_WORKER_BASE_URL=${AI_WORKER_BASE_URL:-http://ai-worker:8000}
      - MATCHAJOB_UPLOAD_DIR=/data/cv
      - MATCHAJOB_CV_MAX_FILE_SIZE=${MATCHAJOB_CV_MAX_FILE_SIZE:-10MB}
      - MATCHAJOB_CV_MAX_REQUEST_SIZE=${MATCHAJOB_CV_MAX_REQUEST_SIZE:-11MB}
      - MATCHAJOB_CV_PROCESSING_ENABLED=${MATCHAJOB_CV_PROCESSING_ENABLED:-true}
      - MATCHAJOB_CV_PROCESSING_POLL_DELAY_MS=${MATCHAJOB_CV_PROCESSING_POLL_DELAY_MS:-2000}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000}
    volumes:
      - cv_storage:/data/cv
    depends_on:
      database:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - matchajob_network

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AI_WORKER_CONTAINER_PORT=${AI_WORKER_CONTAINER_PORT:-8000}
      - AI_PROVIDER=${AI_PROVIDER:-deterministic}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_API_KEY=${AI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - matchajob_network

volumes:
  postgres_data:
  cv_storage:

networks:
  matchajob_network:
    driver: bridge
