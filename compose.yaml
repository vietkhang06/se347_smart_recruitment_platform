name: matchajob

services:
  database:
    image: pgvector/pgvector:pg16
    container_name: matchajob-postgres-pgvector
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchajob_db}
      POSTGRES_USER: ${POSTGRES_USER:-matchajob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchajob_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchajob_user} -d ${POSTGRES_DB:-matchajob_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - matchajob_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: matchajob-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8081/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - matchajob_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchajob-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8081}:${BACKEND_CONTAINER_PORT:-8080}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - BACKEND_CONTAINER_PORT=${BACKEND_CONTAINER_PORT:-8080}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://database:5432/matchajob_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-matchajob_user}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-matchajob_password}
      - AI_WORKER_BASE_URL=${AI_WORKER_BASE_URL:-http://ai-worker:8000}
      - MATCHAJOB_UPLOAD_DIR=${MATCHAJOB_UPLOAD_DIR:-/data/cv}
      - MATCHAJOB_CV_MAX_FILE_SIZE=${MATCHAJOB_CV_MAX_FILE_SIZE:-10MB}
      - MATCHAJOB_CV_MAX_REQUEST_SIZE=${MATCHAJOB_CV_MAX_REQUEST_SIZE:-11MB}
      - MATCHAJOB_CV_PROCESSING_ENABLED=${MATCHAJOB_CV_PROCESSING_ENABLED:-true}
      - MATCHAJOB_CV_PROCESSING_POLL_DELAY_MS=${MATCHAJOB_CV_PROCESSING_POLL_DELAY_MS:-2000}
      - JWT_SECRET=${JWT_SECRET:-dGhpc19pc19hX3Zlcnlfc2VjdXJlX2p3dF9zZWNyZXRfa2V5X2Zvcl9tYXRjaGFqb2JfZGV2XzIwMjY=}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
    volumes:
      - cv_storage:${MATCHAJOB_UPLOAD_DIR:-/data/cv}
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - matchajob_network

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: matchajob-ai-worker
    restart: unless-stopped
    ports:
      - "${AI_WORKER_HOST_PORT:-8001}:${AI_WORKER_CONTAINER_PORT:-8000}"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AI_WORKER_CONTAINER_PORT=${AI_WORKER_CONTAINER_PORT:-8000}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_API_KEY=${AI_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - matchajob_network

volumes:
  postgres_data:
    name: matchajob_postgres_data
  cv_storage:
    name: matchajob_cv_storage

networks:
  matchajob_network:
    name: matchajob_network
    driver: bridge
